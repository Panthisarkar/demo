<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nepali Speech to English Translator</title>
  <style>
    /* Global Styles */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background-color: #f8f9fb;
      color: #333;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 3.5em;
      font-weight: 800;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #FF4B91 0%, #A367B1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
    }

    p {
      font-size: 1.25em;
      color: #1a1a1a;
      margin-bottom: 40px;
      max-width: 600px;
      line-height: 1.6;
    }

    /* Button Styles */
    button {
      margin: 10px;
      padding: 16px 32px;
      font-size: 1.1em;
      color: #fff;
      background: linear-gradient(135deg, #A367B1 0%, #8B3391 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(163, 103, 177, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button::before {
      content: '🎤';
      font-size: 1.2em;
    }

    button#stopRecording::before {
      content: '⏹️';
    }


    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(163, 103, 177, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #e0e0e0;
      color: #999;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Output Box Styles */
    #output {
      margin-top: 40px;
      font-size: 1.2em;
      color: #333;
      border: 2px solid rgba(163, 103, 177, 0.2);
      padding: 24px;
      border-radius: 16px;
      background-color: #fff;
      width: 90%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
    }

    #output:empty {
      padding: 0;
      border: none;
    }

    /* User Stats Section */
    .user-stats {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .user-stats img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #fff;
      margin-left: -8px;
    }

    .user-stats img:first-child {
      margin-left: 0;
    }

    .user-stats-text {
      font-size: 0.95em;
      color: #666;
      margin-left: 8px;
    }

    /* Container Styles */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      h1 {
        font-size: 2.5em;
      }

      p {
        font-size: 1.1em;
        padding: 0 20px;
      }

      button {
        padding: 14px 28px;
        font-size: 1em;
      }

      #output {
        width: 85%;
        padding: 20px;
        font-size: 1.1em;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2em;
      }

      p {
        font-size: 1em;
      }

      button {
        padding: 12px 24px;
        width: 80%;
        max-width: 280px;
      }
    }

    /* Animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1, p, button, #output {
      animation: fadeIn 0.6s ease-out forwards;
    }

    button {
      animation-delay: 0.2s;
    }

    #output {
      animation-delay: 0.3s;
    }

    /* Adding new styles for the audio icon */

    .audio-icon {
      width: 60px;
      height: 60px;
      margin: 20px auto;
      display: none; /* Hidden by default */
      position: relative;
    }

    .audio-icon.recording {
      display: block; /* Show when recording */
    }

    .audio-icon::before {
      content: '🎤';
      font-size: 2.5em;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .audio-waves {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border: 3px solid #A367B1;
      border-radius: 50%;
      opacity: 0;
      animation: wave 1.5s ease-out infinite;
    }

    .audio-waves::before,
    .audio-waves::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border: 3px solid #A367B1;
      border-radius: 50%;
      animation: wave 1.5s ease-out infinite;
    }

    .audio-waves::before {
      animation-delay: 0.5s;
    }

    .audio-waves::after {
      animation-delay: 1s;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1);
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes wave {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
      }
    }

    /* Status text style */
    .status-text {
      font-size: 0.9em;
      color: #A367B1;
      margin-top: 10px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .status-text.active {
      opacity: 1;
    }

    /* Container for the recording interface */
    .recording-interface {
      margin: 20px 0;
      padding: 20px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1> Audio Translator</h1>
  <p>Click the button below to record your Nepali speech:</p>

  <div class="recording-interface">
    <div class="audio-icon">
      <div class="audio-waves"></div>
    </div>
    <div class="status-text">Recording...</div>
    <button id="startRecording">Start Recording</button>
    <button id="stopRecording" disabled>Stop Recording</button>
  </div>

  <div id="output"></div>
   
  <script src="speech.js"></script>
</body>
</html>
